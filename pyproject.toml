[project]
authors = [{name = "Jonathan Renusch", email = "jonathan.renusch@cern.ch"}]
description = "Bidirectional state space models for charged-particle trajectory regression"
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
name = "ssm-track-regression"
requires-python = "== 3.12"
version = "0.1.0"

dependencies = [
    "packaging>=24.1,<27",
    "wheel>=0.45.1,<0.46",
    "numpy>=2.1.2,<3",
    "scipy>=1.16.2,<2",
    "pytest>=8.4.2,<9",
    "matplotlib>=3.10.6,<4",
    "lightning==2.5.2",
    "comet-ml==3.50.0",
    "pandas>=2.3.2,<4",
    "pyarrow>=21.0.0,<24",
    "jsonargparse[signatures]==4.40.1",
    "torchjd>=0.7.0,<0.8",
    "lion-pytorch>=0.2.3,<0.3",
    "awkward>=2.8.8,<3",
    "h5py>=3.14.0,<4",
    "scikit-learn>=1.7.2,<2",
    "einops>=0.8.1,<0.9",
]

[dependency-groups]
fa2 = ["flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.4.17/flash_attn-2.8.3%2Bcu128torch2.9-cp312-cp312-linux_x86_64.whl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/track_regression"]

[tool.pixi.workspace]
channels = ["conda-forge", "nvidia", "nodefaults"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
ssm-track-regression = { path = ".", editable = true }
datasets = ">=4.4.1,<5"
fsspec = { version = ">=2025.10.0,<2027", extras = ["http"] }
colliderml = ">=0.3.1,<0.4"
mamba-ssm = "==2.3.0"
causal-conv1d = "==1.6.0"

[tool.pixi.pypi-options]
no-build-isolation = ["flash-attn", "mamba-ssm", "causal-conv1d"]

[tool.pixi.feature.gpu.pypi-dependencies]
torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cu128"}

[tool.pixi.environments]
default = { features = ["gpu", "fa2"] }

[tool.pixi.system-requirements]
libc = "2.28"
cuda = "12.3"

[tool.pixi.dependencies]
gxx = ">=14.3.0,<14.4"
ninja = ">=1.13.1,<2"
cuda = "12.8.*"

[tool.pytest.ini_options]
filterwarnings = ["ignore:.*distutils Version classes are deprecated. Use packaging.version instead.*:DeprecationWarning"]
markers = ["gpu: mark test to run on GPU", "requiresdata: mark test that requires data not present in the repository"]
