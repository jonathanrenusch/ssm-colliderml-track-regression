[project]
name = "track-regression"
version = "1.0.0"
description = "Seed-guided bidirectional sequence models for charged-particle track fitting"
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch==2.9.1",
    "lightning==2.5.2",
    "jsonargparse[signatures]==4.40.1",
    "lion-pytorch>=0.2.3,<0.3",
    "numpy>=2.1,<3",
    "h5py>=3.14,<4",
    "pyarrow>=21",
    "pyyaml>=6",
    "matplotlib>=3.10,<4",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/track_regression"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---- pixi environment (optional; `pixi install` reproduces the tested environment) ----
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
cuda = "12.8"

[tool.pixi.dependencies]
python = "3.12.*"
gxx = ">=14,<15"          # host C/C++ compiler used by torch.compile / Triton

[tool.pixi.pypi-dependencies]
track-regression = { path = ".", editable = true }
