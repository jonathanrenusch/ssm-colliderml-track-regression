# =============================================================================
# pretrain_ssm_cls_kf_hits — gut-check pretrain on CKF-assigned hits.
# =============================================================================
# Identical to pretrain_ssm_cls.yaml in every architectural / loss /
# optimizer / schedule choice. The ONLY difference is the dataset:
#
#   p0_core_pretrain          → p0_core_kf_hits_pretrain
#
# The kf_hits dataset uses the exact same kinematic / perigee selection
# as `core` but replaces the per-track truth hit set with the **exact
# hits the ACTS CKF assigned** to the matched truth track. Tracks with
# no ACTS match are skipped. This is ``selection_variant: core_kf_hits``
# (``require_acts_dm: true`` AND ``use_acts_hits_only: true``).
#
# Purpose: a controlled gut check on how much performance the SSM-CLS
# regressor loses when it sees only the CKF's view of each track —
# i.e. the realistic in-pipeline input it would consume downstream of a
# CKF pattern-recognition stage — rather than the full truth hit set
# (which is the strict upper bound on hit completeness). The delta
# between this run's headline numbers and the truth-hit baseline
# isolates the precision cost of the CKF hit-assignment imperfection.
# =============================================================================
trainer:
  devices: [0]
  logger:
    init_args:
      name: TRK-SSMCLS-pretrain-kfhits
  callbacks:
    - class_path: track_regression._lib.callbacks.InferenceTimer
    - class_path: track_regression._lib.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
        log_layer_stats: true
        log_output_head_per_dim: true
        output_head_param_groups:
          d0: [0, 7]
          z0: [7, 14]
          phi: [14, 16]
          theta: [16, 23]
          qop: [23, 30]
    - class_path: track_regression.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: track_regression._lib.callbacks.SaveConfig
    - class_path: track_regression._lib.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: track_regression.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      # Unbottlenecked pool_head — matches pretrain_ssm_cls_packed/padded.
      state_head_output_dim: 384
      state_head_hidden_layers: 0
      state_head_dropout: 0.0
      encoder:
        class_path: track_regression.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 192
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: track_regression.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 0.1
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 0.1
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 1.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: /scratch/colliderml/arxiv_retraining/p0_core_kf_hits_pretrain
  num_workers: 8
