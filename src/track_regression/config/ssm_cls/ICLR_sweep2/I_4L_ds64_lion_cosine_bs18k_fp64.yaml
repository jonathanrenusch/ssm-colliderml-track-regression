# =============================================================================
# Trial I — fp64 PROBE.  Sweep-1 trial B run end-to-end in float64
# (Lightning precision 64-true; kernel variant v3c for train and eval), batch
# 18 000 (fp64 doubles activation memory), LR sqrt-scaled for 18 000
# (x2.96 vs the bs-2048 recipe).  Absolute heads, default Fourier scales.
# Machine: sess3, GPU 2.   Question: is any part of the precision floor fp32
# ARITHMETIC?  If the floor moves in fp64 it was arithmetic; if not, it is
# representation/learning and G/H/J are the answer.  Diagnostic, ~2x slower.
# =============================================================================
trainer:
  devices: [2]             # documentary; the launcher pins CUDA_VISIBLE_DEVICES and passes --trainer.devices 1
  max_epochs: 20
  use_distributed_sampler: false
  precision: 64-true
  gradient_clip_val: 1.0
  benchmark: true
  # Full callbacks list (a leaf list REPLACES the base list): identical to base.yaml
  # except KernelSwapCallback variant v3c (pure-torch compiled) for train AND eval —
  # the fused Triton eval kernel is fp32-only.
  callbacks:
    - class_path: track_regression._lib.callbacks.InferenceTimer
    - class_path: track_regression.callbacks.KernelSwapCallback
      init_args:
        variant: v3c
    - class_path: track_regression._lib.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 500
        log_parameter_stats: false
    - class_path: track_regression.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 500
    - class_path: track_regression._lib.callbacks.SaveConfig
    - class_path: track_regression._lib.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: track_regression.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 500
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false
  logger:
    init_args:
      name: SW2-I-4L-ds64-lion-cosine-bs18k-fp64
      project_name: ssm-track-regression-iclr

model:
  optimizer: Lion
  lrs_config:                 # legacy recipe, sqrt-scaled LR for the batch size
    initial: 3.0e-05
    max: 1.5e-04
    end: 3.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false
  model:
    init_args:
      dim: 128
      output_head_hidden_layers: [128]
      input_net_hidden_layers: [128]
      state_head_output_dim: 128
      state_head_hidden_layers: [128]
      state_head_dropout: 0.0
      encoder:
        class_path: track_regression.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 4
          dim: 128
          d_state: 64
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          norm: RMSNorm
          dropout: 0.0
          cls_init_scale: 0.02
          residual_depth_init: true
      loss_module:
        class_path: track_regression.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:    {type: quantile,     weight: 0.1, norm_min: -7.1,   norm_max: 7.1,   quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]}
            z0:    {type: quantile,     weight: 1.0, norm_min: -270.0, norm_max: 270.0, quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]}
            phi:   {type: circular,     weight: 0.1, beta: 0.01}
            theta: {type: quantile_eta, weight: 1.0, norm_min: -3.0,   norm_max: 3.0,   quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]}
            qop:   {type: quantile,     weight: 1.0, norm_min: -1.0,   norm_max: 1.0,   quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]}

data:
  preprocessed_dir: /scratch/colliderml/ICLR_retraining_geom/single_muon_uniform
  batch_size: 18000
  num_workers: 8
  prefetch_factor: 4
  pin_memory: true
  packed_batches: true
  load_acts: true
  max_val_tracks: 1000000
