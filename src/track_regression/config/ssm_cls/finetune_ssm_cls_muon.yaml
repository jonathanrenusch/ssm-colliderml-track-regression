# =============================================================================
# SSM-CLS fine-tune — Muon (2-D weights) + AdamW (1-D weights) hybrid +
# WSD on p200_core_kf_matched, fp32 encoder.
# =============================================================================
# Same architecture / checkpoint / dataset / BS as
# finetune_ssm_cls_adamw.yaml — only the optimizer family / LR / WD
# differs. See that file's header for the shared rationale.
#
# Muon-hybrid (per SpecMuon, arXiv:2602.16167): Muon updates 2-D weight
# matrices via the Newton–Schulz orthogonalised gradient; 1-D
# parameters (biases, layer-norms) still run under AdamW. Two LR
# schedules feed the two groups (``muon_max`` vs ``max``).
# =============================================================================

trainer:
  devices: [0, 1]
  max_epochs: 50
  precision: 32-true
  gradient_clip_val: 1.0
  reload_dataloaders_every_n_epochs: 1
  benchmark: true
  logger:
    class_path: track_regression._lib.comet_logger.MyCometLogger
    init_args:
      name: TRK-SSMCLS-finetune-muon-wsd
      project_name: ssm-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: track_regression._lib.callbacks.InferenceTimer
    - class_path: track_regression._lib.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
        log_layer_stats: true
        log_output_head_per_dim: true
        output_head_param_groups:
          d0: [0, 7]
          z0: [7, 14]
          phi: [14, 16]
          theta: [16, 23]
          qop: [23, 30]
    - class_path: track_regression.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: track_regression._lib.callbacks.SaveConfig
    - class_path: track_regression._lib.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: track_regression.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  # Set this to the path of your pretrained SSM-CLS checkpoint (produced
  # by ``bash scripts/01_train.sh pretrain_ssm_cls``); leave null to
  # fine-tune from scratch.
  pretrained_ckpt_path: null
  optimizer: MuonHybrid
  lrs_config:
    schedule: wsd
    initial: 5.0e-06       # halved from 1e-5
    max: 5.0e-05           # halved from 1e-4 (AdamW group)
    end: 2.5e-06           # halved from 5e-6
    weight_decay: 0.02
    betas: [0.9, 0.95]
    muon_max: 1.5e-04      # halved from 3e-4 (Muon group)
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_ns_steps: 5
    pct_start: 0.02
    decay_pct: 0.5         # 50% cosine cooldown
    skip_scheduler: false

  model:
    init_args:
      # Unbottlenecked pool_head — matches pretrain_ssm_cls_packed/padded.
      state_head_output_dim: 384
      state_head_hidden_layers: 0
      state_head_dropout: 0.0
      encoder:
        class_path: track_regression.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 192
          d_state: 32
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: track_regression.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 0.1
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 0.1
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 1.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  preprocessed_dir: /scratch/colliderml/arxiv_retraining/p200_core_kf_matched_finetune
  load_acts: true
  batch_size: 22000
  num_workers: 1
  pin_memory: true
  streaming: true
  shard_buffer_size: 50
