# =============================================================================
# pretrain_ssm_cls_10L — depth-scaling sweep, 10-layer leaf.
# =============================================================================
# Inherits scaling/base.yaml (auto-loaded by train.py from the same folder).
# Base pins everything — pool=ssm_cls, fp32 encoder, dim=192, d_state=16,
# Lion + OneCycle schedule, p0_core_pretrain dataset, etc. This leaf
# only overrides:
#   1. encoder.num_layers = 10            (depth point on the sweep ladder)
#   2. trainer.logger.name                  (unique Comet experiment id)
#   3. loss_module (5-param Q7)             (base intentionally leaves it unset)
#   4. model.lrs_config                     (matches pretrain_ssm_cls.yaml)
#
# All five leaves of the sweep — 2L, 4L, 6L, 8L, 10L — are identical
# except for encoder.num_layers and trainer.logger.name.
# =============================================================================
trainer:
  devices: [1]
  logger:
    init_args:
      name: TRK-SSMCLS-scaling-pretrain-10L-dstate16

model:
  model:
    init_args:
      state_head_output_dim: 128
      state_head_hidden_layers: [128]
      state_head_dropout: 0.0
      encoder:
        class_path: track_regression.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 10
          dim: 128
          d_state: 16
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: track_regression.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 0.1
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 0.1
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 1.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false
