# =============================================================================
# 4L SSM-CLS fine-tune — Muon (2-D) + AdamW (1-D) hybrid + WSD on
# p200_core_kf_matched, fp32 encoder.
# =============================================================================
# Companion fine-tune for ``pretrain_ssm_cls_4L.yaml`` (4-layer leaf of the
# depth-scaling sweep). Inherits ``experimental/scaling/base.yaml`` which
# already pins the narrower architecture used by the scaling study:
# dim=128, d_state=16, state_head=128, output_head_hidden_layers=[128],
# input_net_hidden_layers=[128], pool=ssm_cls, fp32 encoder.
#
# This config is the 4L equivalent of ``ssm_cls/finetune_ssm_cls_muon.yaml``:
# Muon updates 2-D weight matrices via the Newton-Schulz orthogonalised
# gradient; 1-D parameters (biases, layer-norms, SSM scalars) run under
# AdamW. Two LR schedules feed the two groups (``muon_max`` vs ``max``).
#
# LR rationale (verified with the user before authoring):
#   - 4L pretrain peaked at 5e-5 (Lion, OneCycle) — see scaling/base.yaml.
#   - AdamW peak (max) = 5e-5 matches pretrain peak exactly, preserving the
#     Lion-trained weight-norm basin across the optimizer family switch.
#   - Muon peak (muon_max) = 1.5e-4 = 3x AdamW peak, the same ratio used by
#     the 10L production fine-tune.
#   - Muon already auto-rescales its update by sqrt(max(fan_in, fan_out)),
#     so the narrower dim=128 trunk is partly self-correcting vs dim=192.
#   - No depth-ratio boost applied: SSMs are sensitive at fine-tune time,
#     and the safer starting point is pretrain-LR-matched. If under-fit at
#     val/total minimum, raise muon_max first (it's the orthogonalised
#     group that controls trunk expressivity).
#
# Pool-head shape MUST match the pretrain checkpoint for warm-start to
# load: state_head_output_dim=128 / state_head_hidden_layers=[128] /
# state_head_dropout=0.0 (inherited from scaling/base + scaling 4L leaf).
# =============================================================================

trainer:
  devices: [0, 1]
  max_epochs: 50
  precision: 32-true
  gradient_clip_val: 1.0
  reload_dataloaders_every_n_epochs: 1
  benchmark: true
  logger:
    class_path: track_regression._lib.comet_logger.MyCometLogger
    init_args:
      name: TRK-SSMCLS-finetune-muon-wsd-4L
      project_name: ssm-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: track_regression._lib.callbacks.InferenceTimer
    - class_path: track_regression._lib.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
        log_layer_stats: true
        log_output_head_per_dim: true
        output_head_param_groups:
          d0: [0, 7]
          z0: [7, 14]
          phi: [14, 16]
          theta: [16, 23]
          qop: [23, 30]
    - class_path: track_regression.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: track_regression._lib.callbacks.SaveConfig
    - class_path: track_regression._lib.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: track_regression.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 30
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  pretrained_ckpt_path: /shared/tracking/ssm-colliderml-track-regression/logs/src/track_regression/logs/comet_offline/1e0f5105c86d4bdd98a0cd3fa780f7dc/ckpts/epoch=049-val_total=0.00125.ckpt
  optimizer: MuonHybrid
  lrs_config:
    schedule: wsd
    initial: 5.0e-06
    max: 5.0e-05           # AdamW group peak — matches 4L pretrain peak
    end: 2.5e-06
    weight_decay: 0.02
    betas: [0.9, 0.95]
    muon_max: 1.5e-04      # Muon group peak — 3x AdamW (production ratio)
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_ns_steps: 5
    pct_start: 0.02
    decay_pct: 0.5         # 50% cosine cooldown
    skip_scheduler: false

  model:
    init_args:
      # Pool-head shape matches the 4L pretrain checkpoint (narrow scaling
      # variant) — NOT the unbottlenecked 384-wide head used by the 10L
      # production fine-tune. Required for the warm-start state_dict to
      # load cleanly.
      state_head_output_dim: 128
      state_head_hidden_layers: [128]
      state_head_dropout: 0.0
      encoder:
        class_path: track_regression.mamba_cls.BidirectionalMambaCLSEncoder
        init_args:
          num_layers: 4
          dim: 128
          d_state: 16
          d_conv: 4
          expand: 2
          headdim: 32
          ngroups: 1
          chunk_size: 16
          norm: RMSNorm
          dropout: 0.0
      loss_module:
        class_path: track_regression.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 0.1
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 0.1
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 1.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 1.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

data:
  preprocessed_dir: /scratch/colliderml/arxiv_retraining/p200_core_kf_hits_finetune
  load_acts: true
  batch_size: 22000
  num_workers: 1
  pin_memory: true
  streaming: true
  shard_buffer_size: 50
