# =============================================================================
# Transformer (flash-attn2 + register token) + Q7 — FP32 pretrain on p0_core
# =============================================================================
# Key changes vs the original (broken) config:
#   - pool_head projection (Dense bottleneck) added in model.py — matches
#     the ssm_state path's fwd_head/bwd_head pattern, provides gradient
#     bottleneck before the bf16 encoder backward.
#   - output_head_init_scale: 0.01 — keeps initial predictions near zero.
#   - Removed GradientSpikeSkip (band-aid, root cause now addressed).
#   - Kept transformer-specific stabilisation (qkv_norm, layer_scale,
#     drop_path) as these address attention-specific issues, not the
#     missing-projection-head problem.
# =============================================================================

# Pre-trained checkpoint shipped at checkpoints/pretrain_transformer_1cls/best.ckpt.
# Pass it to `train.py test --ckpt_path ...` for evaluation; leave null here so
# `train.py fit` trains from scratch.
ckpt_path: null
trainer:
  devices: [0]
  max_epochs: 50
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-TXF-Q7-FP32-Core-pretrain
      project_name: ssm-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      dim: 192
      pool: register_token
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      encoder:
        class_path: hepattn.experiments.colliderml_regr.transformer_encoder.EncoderWithCLS
        init_args:
          dim: 192
          num_layers: 12
          attn_type: flash-varlen
          norm: RMSNorm
          value_residual: false
          qkv_norm: true
          layer_scale: 1.0e-5
          drop_path: 0.05
          attn_kwargs:
            num_heads: 6
          dense_kwargs:
            hidden_dim_scale: 4
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: ${DATA_ROOT}/p0_core_pretrain
  batch_size: 2048
  num_workers: 8
