# =============================================================================
# Transformer (flash-attn2 + 2 register tokens) + Q7 — FP32 pretrain on p0_core
# =============================================================================
# Sibling of txf_q7_pretrain.yaml.  Single change: num_cls_tokens=2 in the
# encoder, so the pool readout becomes (B, 2*dim) — matching the
# bidirectional Mamba-2 CLS-pool readout dim and removing the
# 1-vs-2 register-token asymmetry between the two baselines.  The model's
# register_token branch reads ``encoder.pool_dim`` so pool_head input dim
# automatically tracks num_cls_tokens (no model.py YAML changes needed).
#
# Pool_head therefore changes from Linear(dim, state_head_output_dim) to
# Linear(2*dim, state_head_output_dim) under the inherited base config.
# Output_head and everything downstream are untouched.
#
# Recipe (Lion + OneCycle + same peak LR + same num_layers/dim) is kept
# byte-identical to txf_q7_pretrain.yaml so the only configuration delta
# is the register-token count — this is the comparison the paper reports
# when controlling for readout-token count. 
# =============================================================================
trainer:
  devices: [3]
  max_epochs: 50
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      name: TRK-TXF-Q7-FP32-Core-pretrain-2cls
      project_name: ssm-track-regression
      offline_directory: logs/comet_offline
  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.GradientLoggerCallback
      init_args:
        log_every_n_steps: 50
        log_parameter_stats: false
    - class_path: hepattn.experiments.colliderml_regr.callbacks.MinimalGpuMonitor
      init_args:
        log_every_n_steps: 50
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/total
        mode: min
        verbose: true
    - class_path: hepattn.experiments.colliderml_regr.callbacks.RegressionPredictionWriter
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/total
        patience: 50
        min_delta: 0.0
        mode: min
        verbose: true
        check_on_train_epoch_end: false

model:
  model:
    init_args:
      dim: 192
      pool: register_token
      input_net_hidden_layers: [192]
      output_head_hidden_layers: [256]
      output_head_init_scale: 0.01
      encoder:
        class_path: hepattn.experiments.colliderml_regr.transformer_encoder.EncoderWithCLS
        init_args:
          dim: 192
          num_cls_tokens: 2
          num_layers: 12
          attn_type: flash-varlen
          norm: RMSNorm
          value_residual: false
          qkv_norm: true
          layer_scale: 1.0e-5
          drop_path: 0.05
          attn_kwargs:
            num_heads: 6
          dense_kwargs:
            hidden_dim_scale: 4
      loss_module:
        class_path: hepattn.experiments.colliderml_regr.losses.TrackParameterLoss
        init_args:
          parameter_order: [d0, z0, phi, theta, qop]
          config:
            d0:
              type: quantile
              weight: 1.0
              norm_min: -2.5
              norm_max: 2.5
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            z0:
              type: quantile
              weight: 1.0
              norm_min: -200.0
              norm_max: 200.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            phi:
              type: circular
              weight: 1.0
              beta: 0.01
            theta:
              type: quantile_eta
              weight: 10.0
              norm_min: -3.0
              norm_max: 3.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
            qop:
              type: quantile
              weight: 5.0
              norm_min: -2.0
              norm_max: 2.0
              quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

  optimizer: Lion
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.10
    weight_decay: 1.0e-03
    skip_scheduler: false

data:
  preprocessed_dir: ${DATA_ROOT}/p0_core_pretrain
  batch_size: 2048
  num_workers: 8
